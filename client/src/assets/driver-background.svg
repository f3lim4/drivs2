<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.85" />
    </linearGradient>
    
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="connectGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.8" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Connection network -->
  <g opacity="0.4">
    <!-- Network nodes -->
    <circle cx="200" cy="150" r="8" fill="url(#nodeGradient)"/>
    <circle cx="400" cy="100" r="6" fill="url(#nodeGradient)"/>
    <circle cx="600" cy="200" r="10" fill="url(#nodeGradient)"/>
    <circle cx="800" cy="120" r="7" fill="url(#nodeGradient)"/>
    <circle cx="1000" cy="180" r="9" fill="url(#nodeGradient)"/>
    
    <circle cx="150" cy="300" r="6" fill="url(#nodeGradient)"/>
    <circle cx="350" cy="250" r="8" fill="url(#nodeGradient)"/>
    <circle cx="550" cy="350" r="7" fill="url(#nodeGradient)"/>
    <circle cx="750" cy="280" r="9" fill="url(#nodeGradient)"/>
    <circle cx="950" cy="320" r="6" fill="url(#nodeGradient)"/>
    
    <circle cx="250" cy="450" r="9" fill="url(#nodeGradient)"/>
    <circle cx="450" cy="400" r="7" fill="url(#nodeGradient)"/>
    <circle cx="650" cy="500" r="8" fill="url(#nodeGradient)"/>
    <circle cx="850" cy="420" r="6" fill="url(#nodeGradient)"/>
    <circle cx="1050" cy="480" r="10" fill="url(#nodeGradient)"/>
    
    <!-- Connection lines -->
    <path d="M200 150 Q300 125 400 100" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M400 100 Q500 150 600 200" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M600 200 Q700 160 800 120" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M800 120 Q900 150 1000 180" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3.5s" repeatCount="indefinite"/>
    </path>
    
    <path d="M150 300 Q250 275 350 250" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M350 250 Q450 300 550 350" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M550 350 Q650 315 750 280" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M750 280 Q850 300 950 320" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.8s" repeatCount="indefinite"/>
    </path>
    
    <path d="M250 450 Q350 425 450 400" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M450 400 Q550 450 650 500" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.7s" repeatCount="indefinite"/>
    </path>
    <path d="M650 500 Q750 460 850 420" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M850 420 Q950 450 1050 480" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.6">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Vertical connections -->
    <path d="M200 150 Q175 225 150 300" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M400 100 Q375 175 350 250" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M600 200 Q575 275 550 350" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3.7s" repeatCount="indefinite"/>
    </path>
    <path d="M800 120 Q775 200 750 280" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.3s" repeatCount="indefinite"/>
    </path>
    <path d="M1000 180 Q975 250 950 320" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="4.2s" repeatCount="indefinite"/>
    </path>
    
    <path d="M150 300 Q200 375 250 450" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3.3s" repeatCount="indefinite"/>
    </path>
    <path d="M350 250 Q400 325 450 400" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.9s" repeatCount="indefinite"/>
    </path>
    <path d="M550 350 Q600 425 650 500" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M750 280 Q800 350 850 420" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M950 320 Q1000 400 1050 480" stroke="url(#connectGradient)" stroke-width="2" fill="none" opacity="0.5">
      <animate attributeName="stroke-dasharray" values="0,100;20,80;0,100" dur="4.1s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Central hub -->
  <g transform="translate(600, 400)">
    <circle cx="0" cy="0" r="80" fill="url(#glowGradient)" opacity="0.3"/>
    <circle cx="0" cy="0" r="40" fill="url(#nodeGradient)" opacity="0.8"/>
    <circle cx="0" cy="0" r="25" fill="#ffffff" opacity="0.9"/>
    
    <!-- Central icon -->
    <g transform="scale(0.8)">
      <path d="M-15 -15 Q0 -25 15 -15 Q25 0 15 15 Q0 25 -15 15 Q-25 0 -15 -15" fill="#3b82f6"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
      <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
    </g>
    
    <!-- Pulse effect -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="50;70;50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="60;80;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating data particles -->
  <g opacity="0.6">
    <circle cx="100" cy="200" r="3" fill="#60a5fa">
      <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="350" r="2" fill="#34d399">
      <animate attributeName="cy" values="350;330;350" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="150" r="4" fill="#f59e0b">
      <animate attributeName="cy" values="150;130;150" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="550" r="3" fill="#ef4444">
      <animate attributeName="cy" values="550;530;550" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="250" r="2" fill="#8b5cf6">
      <animate attributeName="cy" values="250;230;250" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="400" r="3" fill="#06b6d4">
      <animate attributeName="cy" values="400;380;400" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Signal waves -->
  <g transform="translate(600, 400)" opacity="0.3">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#3b82f6" stroke-width="3">
      <animate attributeName="r" values="100;200;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#10b981" stroke-width="2">
      <animate attributeName="r" values="120;220;120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f59e0b" stroke-width="2">
      <animate attributeName="r" values="140;240;140" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Bottom connection indicators -->
  <g transform="translate(0, 700)" opacity="0.4">
    <rect x="100" y="0" width="40" height="8" rx="4" fill="#3b82f6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="0" width="60" height="8" rx="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="0" width="80" height="8" rx="4" fill="#f59e0b">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="0" width="50" height="8" rx="4" fill="#ef4444">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="900" y="0" width="70" height="8" rx="4" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1000" y="0" width="45" height="8" rx="4" fill="#06b6d4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>