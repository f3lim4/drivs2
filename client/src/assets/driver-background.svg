<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="personGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Car body -->
  <rect x="200" y="350" width="400" height="120" rx="15" fill="url(#carGradient)"/>
  
  <!-- Car windows -->
  <rect x="220" y="320" width="100" height="40" rx="5" fill="#87ceeb" opacity="0.7"/>
  <rect x="340" y="320" width="100" height="40" rx="5" fill="#87ceeb" opacity="0.7"/>
  <rect x="460" y="320" width="100" height="40" rx="5" fill="#87ceeb" opacity="0.7"/>
  
  <!-- Car wheels -->
  <circle cx="250" cy="490" r="25" fill="#1f2937"/>
  <circle cx="250" cy="490" r="15" fill="#4b5563"/>
  <circle cx="550" cy="490" r="25" fill="#1f2937"/>
  <circle cx="550" cy="490" r="15" fill="#4b5563"/>
  
  <!-- Driver figure -->
  <g transform="translate(240, 280)">
    <!-- Head -->
    <circle cx="30" cy="30" r="20" fill="url(#personGradient)"/>
    
    <!-- Body -->
    <rect x="15" y="50" width="30" height="40" rx="5" fill="#3b82f6"/>
    
    <!-- Arms -->
    <rect x="0" y="55" width="15" height="25" rx="3" fill="url(#personGradient)"/>
    <rect x="45" y="55" width="15" height="25" rx="3" fill="url(#personGradient)"/>
    
    <!-- Steering wheel -->
    <circle cx="70" cy="65" r="12" fill="#1f2937" fill-opacity="0.8"/>
    <circle cx="70" cy="65" r="8" fill="none" stroke="#4b5563" stroke-width="2"/>
  </g>
  
  <!-- Phone with app -->
  <g transform="translate(500, 250)">
    <rect x="0" y="0" width="40" height="70" rx="8" fill="#1f2937"/>
    <rect x="3" y="8" width="34" height="54" rx="4" fill="#ffffff"/>
    
    <!-- App interface -->
    <rect x="8" y="15" width="24" height="8" rx="2" fill="#3b82f6"/>
    <rect x="8" y="28" width="24" height="3" rx="1" fill="#e5e7eb"/>
    <rect x="8" y="35" width="18" height="3" rx="1" fill="#e5e7eb"/>
    <rect x="8" y="42" width="24" height="12" rx="2" fill="#10b981"/>
  </g>
  
  <!-- Location pin -->
  <g transform="translate(300, 200)">
    <path d="M20 10 C20 4.5 15.5 0 10 0 C4.5 0 0 4.5 0 10 C0 15.5 10 30 10 30 C10 30 20 15.5 20 10 Z" fill="#ef4444"/>
    <circle cx="10" cy="10" r="4" fill="#ffffff"/>
  </g>
  
  <!-- Route line -->
  <path d="M310 220 Q400 180 480 250" stroke="#10b981" stroke-width="3" fill="none" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" values="0;-10" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Background city silhouette -->
  <g opacity="0.3">
    <rect x="50" y="150" width="30" height="100" fill="#1f2937"/>
    <rect x="100" y="120" width="40" height="130" fill="#1f2937"/>
    <rect x="160" y="140" width="25" height="110" fill="#1f2937"/>
    <rect x="600" y="130" width="35" height="120" fill="#1f2937"/>
    <rect x="650" y="100" width="50" height="150" fill="#1f2937"/>
    <rect x="720" y="160" width="30" height="90" fill="#1f2937"/>
  </g>
  
  <!-- Stars -->
  <circle cx="150" cy="80" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="60" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="500" cy="90" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="650" cy="70" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="700" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
</svg>