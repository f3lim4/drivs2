<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.85" />
    </linearGradient>
    
    <linearGradient id="carBodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="driverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a16207;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="windshieldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.5" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- City skyline background -->
  <g opacity="0.15">
    <rect x="0" y="300" width="80" height="200" fill="#1e293b"/>
    <rect x="100" y="250" width="60" height="250" fill="#1e293b"/>
    <rect x="180" y="280" width="90" height="220" fill="#1e293b"/>
    <rect x="290" y="200" width="70" height="300" fill="#1e293b"/>
    <rect x="380" y="320" width="50" height="180" fill="#1e293b"/>
    <rect x="450" y="240" width="80" height="260" fill="#1e293b"/>
    <rect x="850" y="270" width="60" height="230" fill="#1e293b"/>
    <rect x="930" y="200" width="90" height="300" fill="#1e293b"/>
    <rect x="1040" y="300" width="70" height="200" fill="#1e293b"/>
    <rect x="1130" y="250" width="60" height="250" fill="#1e293b"/>
  </g>
  
  <!-- Car body (sedan style) -->
  <g transform="translate(200, 400)">
    <!-- Main body -->
    <ellipse cx="300" cy="80" rx="280" ry="60" fill="url(#carBodyGradient)"/>
    
    <!-- Car roof -->
    <ellipse cx="300" cy="40" rx="200" ry="35" fill="#cbd5e1"/>
    
    <!-- Windshield -->
    <path d="M150 40 Q300 10 450 40 Q430 70 300 75 Q170 70 150 40" fill="url(#windshieldGradient)"/>
    
    <!-- Side windows -->
    <ellipse cx="200" cy="45" rx="30" ry="15" fill="#3b82f6" opacity="0.4"/>
    <ellipse cx="400" cy="45" rx="30" ry="15" fill="#3b82f6" opacity="0.4"/>
    
    <!-- Door handles -->
    <rect x="180" y="70" width="8" height="4" rx="2" fill="#64748b"/>
    <rect x="380" y="70" width="8" height="4" rx="2" fill="#64748b"/>
    
    <!-- Headlights -->
    <ellipse cx="50" cy="75" rx="15" ry="8" fill="#fbbf24"/>
    <ellipse cx="550" cy="75" rx="15" ry="8" fill="#fbbf24"/>
    
    <!-- Wheels -->
    <circle cx="120" cy="140" r="35" fill="#1f2937"/>
    <circle cx="480" cy="140" r="35" fill="#1f2937"/>
    <circle cx="120" cy="140" r="20" fill="#4b5563"/>
    <circle cx="480" cy="140" r="20" fill="#4b5563"/>
    
    <!-- Wheel rims -->
    <circle cx="120" cy="140" r="12" fill="#9ca3af"/>
    <circle cx="480" cy="140" r="12" fill="#9ca3af"/>
  </g>
  
  <!-- Driver figure (more detailed) -->
  <g transform="translate(320, 350)">
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="url(#driverGradient)"/>
    
    <!-- Hair -->
    <path d="M-20 -15 Q0 -35 20 -15 Q15 -25 0 -25 Q-15 -25 -20 -15" fill="#1f2937"/>
    
    <!-- Face features -->
    <circle cx="-8" cy="-3" r="2" fill="#1f2937"/>
    <circle cx="8" cy="-3" r="2" fill="#1f2937"/>
    <path d="M-5 5 Q0 8 5 5" stroke="#1f2937" stroke-width="1.5" fill="none"/>
    
    <!-- Body/shirt -->
    <rect x="-20" y="25" width="40" height="50" rx="8" fill="#3b82f6"/>
    
    <!-- Arms -->
    <ellipse cx="-35" cy="40" rx="8" ry="20" fill="url(#driverGradient)"/>
    <ellipse cx="35" cy="40" rx="8" ry="20" fill="url(#driverGradient)"/>
    
    <!-- Hands on steering wheel -->
    <circle cx="-25" cy="55" r="5" fill="url(#driverGradient)"/>
    <circle cx="25" cy="55" r="5" fill="url(#driverGradient)"/>
    
    <!-- Steering wheel -->
    <circle cx="0" cy="55" r="20" fill="#1f2937"/>
    <circle cx="0" cy="55" r="15" fill="none" stroke="#4b5563" stroke-width="2"/>
    <circle cx="0" cy="55" r="3" fill="#6b7280"/>
  </g>
  
  <!-- Dashboard -->
  <g transform="translate(250, 460)">
    <rect x="0" y="0" width="300" height="30" rx="5" fill="#1e293b"/>
    <rect x="20" y="8" width="60" height="15" rx="3" fill="#3b82f6"/>
    <rect x="100" y="8" width="80" height="15" rx="3" fill="#1f2937"/>
    <rect x="200" y="8" width="40" height="15" rx="3" fill="#ef4444"/>
  </g>
  
  <!-- Phone with ride-share app -->
  <g transform="translate(580, 420)">
    <rect x="0" y="0" width="60" height="100" rx="12" fill="url(#phoneGradient)"/>
    <rect x="5" y="15" width="50" height="70" rx="8" fill="#f8fafc"/>
    
    <!-- App interface -->
    <rect x="10" y="20" width="40" height="12" rx="2" fill="#3b82f6"/>
    <text x="30" y="29" font-family="Arial, sans-serif" font-size="6" text-anchor="middle" fill="#ffffff">UBER</text>
    
    <rect x="10" y="38" width="40" height="20" rx="3" fill="#10b981"/>
    <circle cx="30" cy="48" r="6" fill="#ffffff"/>
    <circle cx="30" cy="48" r="2" fill="#10b981"/>
    
    <rect x="10" y="63" width="40" height="8" rx="2" fill="#e5e7eb"/>
    <rect x="10" y="74" width="25" height="6" rx="1" fill="#e5e7eb"/>
  </g>
  
  <!-- GPS route visualization -->
  <g transform="translate(100, 200)">
    <!-- Route line -->
    <path d="M50 100 Q200 50 350 100 Q500 150 650 100 Q800 50 950 100" 
          stroke="#10b981" stroke-width="4" fill="none" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" values="0;-15" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Start location pin -->
    <g transform="translate(50, 80)">
      <path d="M15 10 C15 4.5 11.5 0 7 0 C2.5 0 -1 4.5 -1 10 C-1 15.5 7 25 7 25 C7 25 15 15.5 15 10 Z" fill="#3b82f6"/>
      <circle cx="7" cy="10" r="3" fill="#ffffff"/>
    </g>
    
    <!-- End location pin -->
    <g transform="translate(950, 80)">
      <path d="M15 10 C15 4.5 11.5 0 7 0 C2.5 0 -1 4.5 -1 10 C-1 15.5 7 25 7 25 C7 25 15 15.5 15 10 Z" fill="#ef4444"/>
      <circle cx="7" cy="10" r="3" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- App branding elements -->
  <g transform="translate(800, 150)">
    <!-- App logo background -->
    <circle cx="0" cy="0" r="30" fill="#000000"/>
    <circle cx="0" cy="0" r="25" fill="#ffffff"/>
    
    <!-- Stylized car icon -->
    <rect x="-15" y="-5" width="30" height="8" rx="4" fill="#000000"/>
    <circle cx="-10" cy="5" r="3" fill="#000000"/>
    <circle cx="10" cy="5" r="3" fill="#000000"/>
  </g>
  
  <!-- Ambient lighting effects -->
  <g opacity="0.3">
    <circle cx="400" cy="200" r="100" fill="#3b82f6" opacity="0.1"/>
    <circle cx="800" cy="300" r="150" fill="#10b981" opacity="0.1"/>
    <circle cx="200" cy="400" r="80" fill="#f59e0b" opacity="0.1"/>
  </g>
  
  <!-- Rating stars -->
  <g transform="translate(650, 350)">
    <g transform="scale(0.8)">
      <polygon points="12,2 15,8 22,8 17,12 19,18 12,15 5,18 7,12 2,8 9,8" fill="#fbbf24"/>
      <polygon points="32,2 35,8 42,8 37,12 39,18 32,15 25,18 27,12 22,8 29,8" fill="#fbbf24"/>
      <polygon points="52,2 55,8 62,8 57,12 59,18 52,15 45,18 47,12 42,8 49,8" fill="#fbbf24"/>
      <polygon points="72,2 75,8 82,8 77,12 79,18 72,15 65,18 67,12 62,8 69,8" fill="#fbbf24"/>
      <polygon points="92,2 95,8 102,8 97,12 99,18 92,15 85,18 87,12 82,8 89,8" fill="#fbbf24"/>
    </g>
    <text x="50" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fbbf24">5.0</text>
  </g>
</svg>