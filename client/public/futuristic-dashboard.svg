<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Screen -->
  <rect x="50" y="50" width="300" height="200" rx="15" ry="15" 
        fill="url(#screenGradient)" filter="url(#screenGlow)" stroke="#00f5ff" stroke-width="2"/>
  
  <!-- Screen Content -->
  <rect x="70" y="70" width="80" height="60" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00f5ff" stroke-width="1"/>
  <rect x="170" y="70" width="80" height="60" rx="5" fill="rgba(255,255,255,0.1)" stroke="#00d9ff" stroke-width="1"/>
  <rect x="270" y="70" width="60" height="60" rx="5" fill="rgba(255,255,255,0.1)" stroke="#06b6d4" stroke-width="1"/>
  
  <!-- Data Bars -->
  <rect x="70" y="150" width="60" height="8" rx="4" fill="rgba(0,245,255,0.3)"/>
  <rect x="70" y="150" width="45" height="8" rx="4" fill="#00f5ff">
    <animate attributeName="width" values="20;60;35;50" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="70" y="170" width="60" height="8" rx="4" fill="rgba(6,182,212,0.3)"/>
  <rect x="70" y="170" width="35" height="8" rx="4" fill="#06b6d4">
    <animate attributeName="width" values="40;25;55;35" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Circular Progress -->
  <circle cx="300" cy="180" r="25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  <circle cx="300" cy="180" r="25" fill="none" stroke="#00f5ff" stroke-width="4" 
          stroke-dasharray="157" stroke-dashoffset="39" transform="rotate(-90 300 180)">
    <animate attributeName="stroke-dashoffset" values="157;39;78;39" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection Lines -->
  <path d="M150 100 Q200 80 250 100" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Status Indicators -->
  <circle cx="80" cy="90" r="4" fill="#00ff00">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="90" r="4" fill="#00f5ff">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="90" r="4" fill="#ff6b00">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating Elements -->
  <rect x="20" y="20" width="30" height="20" rx="3" fill="rgba(0,245,255,0.2)" stroke="#00f5ff" stroke-width="1">
    <animate attributeName="y" values="20;10;20" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="350" y="260" width="25" height="15" rx="3" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1">
    <animate attributeName="y" values="260;250;260" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>